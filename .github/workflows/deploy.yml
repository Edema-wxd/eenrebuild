name: Build and Deploy to FTP

# Blog content is pulled from Contentful at build time (static export), so the
# site must be rebuilt whenever a post is published. Triggers:
#   - push to main            → code changes
#   - repository_dispatch     → Contentful publish/unpublish webhook
#   - workflow_dispatch       → manual "Run workflow" button
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [contentful-publish]
  workflow_dispatch:

# Never run two uploads at once; a newer build supersedes a queued one
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://eenconsult.com.ng' }}

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./out/
          # Must end with a slash
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
